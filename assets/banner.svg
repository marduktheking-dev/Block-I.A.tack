<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="Block-I.A.tack">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#101d2e"/>
    </linearGradient>
    <linearGradient id="brilho" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fb950"/>
      <stop offset="1" stop-color="#2f81f7"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="280" fill="url(#fundo)"/>

  <!-- grade sutil de fundo -->
  <g stroke="#21262d" stroke-width="1" opacity="0.55">
    <path d="M0 70H1000M0 140H1000M0 210H1000"/>
    <path d="M100 0V280M300 0V280M500 0V280M700 0V280M900 0V280"/>
  </g>

  <!-- pacote/bloqueio de dados interceptado -->
  <g transform="translate(560,52)">
    <circle cx="70" cy="88" r="82" fill="none" stroke="#21262d" stroke-width="2" opacity="0.8"/>
    <!-- escudo -->
    <path d="M70 10 L124 32 V84 C124 122 100 150 70 166 C40 150 16 122 16 84 V32 Z"
          fill="url(#brilho)" opacity="0.16" stroke="url(#brilho)" stroke-width="4"/>
    <!-- cadeado -->
    <rect x="52" y="88" width="36" height="30" rx="5" fill="url(#brilho)"/>
    <path d="M58 88 V72 a12 12 0 0 1 24 0 V88" fill="none" stroke="url(#brilho)" stroke-width="6"
          stroke-linecap="round"/>
    <circle cx="70" cy="101" r="4" fill="#0d1117"/>
  </g>

  <!-- título -->
  <text x="60" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="58" font-weight="700" fill="#e6edf3" letter-spacing="1">Block-I.A.tack</text>
  <text x="62" y="158" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="24" fill="#8b949e">guardrail determinístico para agentes de IA</text>
  <text x="62" y="196" font-family="ui-monospace, monospace"
        font-size="17" fill="#3fb950">DENY nunca vira ALLOW</text>
  <text x="62" y="222" font-family="ui-monospace, monospace"
        font-size="17" fill="#8b949e">fail-closed &#183; offline &#183; zero depend&#234;ncias &#183; p50 &lt; 2 ms</text>

  <!-- rodapé -->
  <line x1="60" y1="244" x2="940" y2="244" stroke="#21262d" stroke-width="2"/>
  <text x="62" y="266" font-family="Segoe UI, sans-serif" font-size="15" fill="#6e7681">
    L0 regras determin&#237;sticas &#183; L1 scorer em sombra &#183; plugin OpenCode &#183; red team medido
  </text>
</svg>
